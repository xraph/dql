name: Release

# Two ways in. A green CI run on main hands the version to semantic-release,
# which reads it off the conventional commits since the last tag. A manual run
# with a version cuts exactly that version through scripts/release.sh, the same
# script `make release VERSION=vX.Y.Z` runs on a laptop. A manual run without a
# version is the semantic-release path started by hand.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release exactly this version (vX.Y.Z). Leave empty to let semantic-release choose.'
        type: string
        default: ''
      dry-run:
        description: 'Compute and print the release without publishing anything.'
        type: boolean
        default: false
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

# Two merges inside one CI cycle would otherwise start two release runs. Both
# compute the same next version, and the second's CHANGELOG push is rejected
# non-fast-forward after the first already tagged.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    # `branches:` above matches the TRIGGERING run's head_branch, and a fork's
    # default branch is also `main` — so a green CI run on a fork would otherwise
    # fire this release. The event and repository checks close that.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.version == '') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    uses: xraph/workflows/.github/workflows/semantic-release.yml@v1
    with:
      warm-go-proxy: true
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || false }}

  release-version:
    name: release the requested version
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      # The workflow_run path only releases what CI just verified. A manual
      # version has no such run behind it, so find CI's run for the tip of
      # main and wait for it rather than rebuilding the verify and test matrix
      # here. Started right after a push, this sits until CI finishes; it only
      # fails when CI failed or never ran for the commit.
      - name: Wait for a green CI run on the tip of main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          run_id=""
          # The push that created this commit may still be queueing its CI run.
          for attempt in $(seq 1 12); do
            run_id=$(gh run list --workflow ci.yml --commit "$sha" --json databaseId,createdAt \
              --jq 'sort_by(.createdAt) | last | .databaseId // empty')
            [ -n "$run_id" ] && break
            echo "no CI run for $sha yet (attempt $attempt of 12); waiting 10s"
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "::error::CI never started for $sha; push the commit, let CI run, then run this again"
            exit 1
          fi
          echo "CI run $run_id covers $sha; waiting for it to finish"
          gh run watch "$run_id" --exit-status --interval 15
          echo "CI passed for $sha"

      - name: Configure the release author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release the requested version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            scripts/release.sh "$VERSION" --dry-run
          else
            scripts/release.sh "$VERSION"
          fi
