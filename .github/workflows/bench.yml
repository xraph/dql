name: Bench

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

# A newer push supersedes an in-flight run; benchmarks are slow and the stale
# result is never the one anyone wants.
concurrency:
  group: bench-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Invoked directly rather than through `make bench-ci` because the base commit
  # predates that target on any branch cut before this workflow landed.
  BENCH_CMD: go test -run=^$ -bench=. -benchmem -benchtime=100ms -count=6 ./...

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      # Baseline and head run in the same job on the same runner. Splitting them
      # across jobs would put machine-to-machine variance — routinely larger than
      # the regression being hunted — straight into the comparison.
      - name: Benchmark base
        run: |
          git checkout --detach ${{ github.event.pull_request.base.sha }}
          ${{ env.BENCH_CMD }} > /tmp/old.txt 2>&1 || true
          grep -c '^Benchmark' /tmp/old.txt > /tmp/old.count || echo 0 > /tmp/old.count
          echo "base produced $(cat /tmp/old.count) benchmark lines"

      - name: Benchmark head
        run: |
          git checkout --detach ${{ github.event.pull_request.head.sha }}
          ${{ env.BENCH_CMD }} > /tmp/new.txt 2>&1 | tee /dev/stderr

      - name: Compare
        run: |
          if [ "$(cat /tmp/old.count)" -eq 0 ]; then
            echo "Base commit has no benchmarks — nothing to compare against." \
              | tee /tmp/report.txt
            exit 0
          fi
          benchstat /tmp/old.txt /tmp/new.txt | tee /tmp/report.txt
          bash scripts/bench-gate.sh /tmp/old.txt /tmp/new.txt

      - name: Comment results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = 'No report produced.';
            try { report = fs.readFileSync('/tmp/report.txt', 'utf8'); } catch (e) {}
            const body = '## Benchmark comparison\n\n```\n' + report + '\n```';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
